name: APK Derle

# Bu branch'e her push'ta ve elle tetiklemede debug APK üretir,
# ardından APK'yı bir GitHub Release'e ("latest") ekler — telefondan kolayca indirilir.
on:
  push:
    branches:
      - "claude/android-parental-control-gI87H"
      - "main"
      - "master"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 'latest' sürümünü oluşturabilmek için

    defaults:
      run:
        working-directory: android

    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK hazırla
        uses: android-actions/setup-android@v3

      - name: Gradle önbelleği
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android

      - name: gradlew çalıştırılabilir yap
        run: chmod +x ./gradlew

      - name: Debug APK derle
        run: ./gradlew assembleDebug --stacktrace

      - name: APK'yı artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: kefo-baba-takipte-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Sürüm olarak yayınla (latest)
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Kefo Baba Takipte — Son Derleme (debug)
          body: |
            Otomatik üretilen debug APK. Telefona kurmak için aşağıdaki
            `app-debug.apk` dosyasını indir. (Yer tutucu google-services.json ile
            derlenmiştir; arayüz çalışır, gerçek bildirimler için kendi Firebase
            yapılandırmanı ekle.)
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
